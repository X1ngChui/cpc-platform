# Scenario of the unit and smoke tests.
# The workload is synthetic (generated on first use by tests/conftest.py and scripts/smoke_test.py with
# examples/datasets/synthetic_workload.py); the grid signals are July 2026 data converted by
# examples/datasets/cn_grid/convert.py (committed with the tests). Server parameters are illustrative
# (8-GPU A100-class server) and only exercise the platform.

name: test-4dc

clock:
  start: "2026-07-15T00:00:00+08:00"
  speedup: 1

sources:
  - {id: east,  name: Shanghai,  lat: 31.23, lon: 121.47, share: 0.40}
  - {id: south, name: Guangzhou, lat: 23.13, lon: 113.26, share: 0.35}
  - {id: north, name: Beijing,   lat: 39.90, lon: 116.40, share: 0.25}

node_profiles:
  a100x8:
    # illustrative: tables from "60-400 W per GPU, power ~ occupancy^0.7, host 800-1500 W linear" at 5 occupancies
    description: 8-GPU A100-class server (illustrative)
    slots: 16
    power_w: [[0, 1280], [0.25, 2485.7], [0.5, 3304.4], [0.75, 4028.9], [1, 4700]]
    tpot_s: [[0, 0.025], [1, 0.04]]
    prefill_tokens_per_s: 20000
    boot_s: 60

sites:
  - id: sh
    name: Yangtze River Delta - Shanghai
    region: shanghai
    lat: 31.15
    lon: 121.12
    pue: 1.25
    pools: [{id: main, profile: a100x8, count: 4}]
  - id: gd
    name: Greater Bay Area - Shaoguan
    region: guangdong
    lat: 24.81
    lon: 113.60
    pue: 1.25
    pools: [{id: main, profile: a100x8, count: 4}]
  - id: gz
    name: Guizhou - Gui'an
    region: guizhou
    lat: 26.40
    lon: 106.40
    pue: 1.20
    pools: [{id: main, profile: a100x8, count: 6}]
  - id: nm
    name: Inner Mongolia - Horinger
    region: inner_mongolia
    lat: 40.38
    lon: 111.82
    pue: 1.20
    pools: [{id: main, profile: a100x8, count: 6}]

network:
  emulate_wan: true
  default_source: east

grid:
  price:  {dataset: datasets/cn-grid-2026-07, signal: price}
  carbon: {dataset: datasets/cn-grid-2026-07, signal: carbon_intensity}
  dr_events:
    - {site: gd, start: "2026-07-15T15:00:00+08:00", end: "2026-07-15T17:00:00+08:00", cap_kw: 8}

workload:
  dataset: datasets/workload-synthetic
  seed: 1

slo:
  ttft_s: 2.0
  tpot_s: 0.15

scheduler:
  routing:  {policy: nearest, params: {max_wait_s: 0.5}}
  capacity: {policy: reactive, params: {target_util: 0.6}}
  control_interval_s: 15
  sim_control_interval_s: 300
  carbon_price_per_kg: 0.1
  queue_limit_per_slot: 4
