# 单元测试与冒烟测试用场景。
# 负载为合成数据集（tests/conftest.py 与 scripts/smoke_test.py 在首次使用时用 examples/datasets/synthetic_workload.py 生成）；
# 电网信号为 examples/datasets/cn_grid/convert.py 转换得到的 2026 年 7 月数据（随测试提交）。
# 服务器参数为示意值（8 卡 A100 级服务器），只用于检验平台行为。

name: test-4dc

clock:
  start: "2026-07-15T00:00:00+08:00"
  speedup: 1

sources:
  - {id: east,  name: 上海,  lat: 31.23, lon: 121.47, share: 0.40}
  - {id: south, name: 广州,  lat: 23.13, lon: 113.26, share: 0.35}
  - {id: north, name: 北京,  lat: 39.90, lon: 116.40, share: 0.25}

node_profiles:
  a100x8:
    # 示意值：表按"单卡 60–400 W、功率 ∝ 占用率^0.7，主机 800–1500 W 线性"的公式在 5 个占用率上计算得到。
    description: 8 卡 A100 级服务器（示意值）
    slots: 16
    power_w: [[0, 1280], [0.25, 2485.5], [0.5, 3304.4], [0.75, 4029.0], [1, 4700]]
    tpot_s: [[0, 0.025], [1, 0.04]]
    prefill_tokens_per_s: 20000
    boot_s: 60

sites:
  - id: sh
    name: 长三角·上海
    region: shanghai
    lat: 31.15
    lon: 121.12
    pue: 1.25
    pools: [{id: main, profile: a100x8, count: 4}]
  - id: gd
    name: 粤港澳·韶关
    region: guangdong
    lat: 24.81
    lon: 113.60
    pue: 1.25
    pools: [{id: main, profile: a100x8, count: 4}]
  - id: gz
    name: 贵州·贵安
    region: guizhou
    lat: 26.40
    lon: 106.40
    pue: 1.20
    pools: [{id: main, profile: a100x8, count: 6}]
  - id: nm
    name: 内蒙古·和林格尔
    region: inner_mongolia
    lat: 40.38
    lon: 111.82
    pue: 1.20
    pools: [{id: main, profile: a100x8, count: 6}]

network:
  emulate_wan: true
  default_source: east

grid:
  price:  {dataset: datasets/cn-grid-2026-07, signal: price}
  carbon: {dataset: datasets/cn-grid-2026-07, signal: carbon_intensity}
  dr_events:
    - {site: gd, start: "2026-07-15T15:00:00+08:00", end: "2026-07-15T17:00:00+08:00", cap_kw: 8}

workload:
  dataset: datasets/workload-synthetic
  seed: 1

slo:
  ttft_s: 2.0
  tpot_s: 0.15

scheduler:
  routing:  {policy: nearest, params: {max_wait_s: 0.5}}
  capacity: {policy: reactive, params: {target_util: 0.6}}
  control_interval_s: 15
  sim_control_interval_s: 300
  carbon_price_per_kg: 0.1
  queue_limit_per_slot: 4
