$schema: https://datapackage.org/profiles/2.0/datapackage.json
name: cn-grid-2026-07
version: 2026-07-01_2026-08-01
title: Provincial time-of-use electricity prices in China (expanded rules) and 2023 provincial average CO2 emission factors of electricity
licenses:
- name: public government information
sources:
- title: time-of-use tariff documents of the provincial development and reform commissions (see source in tou_tariffs.yaml)
- title: 'Ministry of Ecology and Environment, National Bureau of Statistics: Announcement No. 47 of 2025'
  path: https://www.mee.gov.cn/xxgk2018/xxgk/xxgk01/202512/t20251231_1139517.html
cpc:
  kind: grid_signal
  profile: 1
  signals:
    price:
      unit: CNY/kWh
      note: the flat price is illustrative; the multipliers apply to the whole flat price
    carbon_intensity:
      unit: kgCO2/kWh
      basis: average CO2 emission factor of electricity (2023 annual mean)
  citation: 'Ministry of Ecology and Environment, National Bureau of Statistics. Announcement on the 2023 CO2 emission factors of electricity (Announcement No. 47 of 2025). 2025.'
  conversion:
    script: examples/datasets/cn_grid/convert.py
    start: '2026-07-01T00:00:00+08:00'
    end: '2026-08-01T00:00:00+08:00'
    assumption: the 2023 provincial annual factor is the constant carbon intensity over the converted period
resources:
- name: signals
  type: table
  path: signals.csv
  format: csv
  bytes: 92464
  hash: sha256:0abf3848f5fabbd4f8c19eebfc6adc60b172825f2c5c210e28237bef3965b84d
  schema:
    fields:
    - name: region
      type: string
      constraints:
        required: true
    - name: start
      type: datetime
      constraints:
        required: true
    - name: end
      type: datetime
      constraints:
        required: true
    - name: signal
      type: string
      constraints:
        required: true
    - name: value
      type: number
      constraints:
        required: true
    - name: label
      type: string
      description: time-of-use period
