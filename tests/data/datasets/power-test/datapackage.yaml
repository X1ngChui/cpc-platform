# Power-profile dataset for the unit tests (synthetic).
name: power-test
version: "1"
title: synthetic power profile (tests)
licenses: [{name: CC0-1.0}]
cpc: {kind: power_profile, profile: 1, synthetic: true}
resources:
  - name: measurements
    type: table
    path: measurements.csv
    format: csv
    schema:
      fields:
        - {name: device, type: string}
        - {name: device_count, type: integer}
        - {name: model, type: string}
        - {name: concurrency, type: number}
        - {name: power_w, type: number, unit: W}
        - {name: itl_s, type: number, unit: s}
        - {name: task, type: string}
