# 示例场景：美国 3 个平衡区（加州 CISO、得州 ERCO、PJM）的逐时碳强度 + Azure 2024 对话负载，日期一致（2024-05-14）。
#
# 数据准备（见 examples/datasets/README.md）：
#   python examples/datasets/azure_llm.py --variant 2024-conv --zero-output fail
#   python examples/datasets/eia930.py --series adjusted          # 碳强度：EIA-930 分燃料发电量 × 生命周期排放因子
#   python examples/datasets/constant_signal.py --name us-flat-price --signal price --unit USD/kWh #       --values CISO=0.08 ERCO=0.08 PJM=0.08 --start 2024-01-01T00:00:00Z --end 2025-01-01T00:00:00Z
# 电价为统一的示意值（非实测）：本场景用于研究碳强度感知调度，成本结果不具实际意义。

name: us-eia-3ba

clock:
  start: "2024-05-14T00:00:00+00:00"
  speedup: 1

sources:
  - {id: west,    name: Los Angeles, lat: 34.05, lon: -118.24, share: 0.35}
  - {id: central, name: Dallas,      lat: 32.78, lon: -96.80,  share: 0.25}
  - {id: east,    name: New York,    lat: 40.71, lon: -74.01,  share: 0.40}

node_profiles:            # 同 configs/scenario.yaml
  h100x8:
    # 8×H100 服务器运行 Llama-3.1-405B-Instruct-FP8。表由 ML.ENERGY Benchmark v3 的测量生成：
    #   cpc profile ${CPC_DATA_DIR}/mlenergy-benchmark-v3-llm --slots 128 --idle-w 1360 --host-w 800 \
    #       --where device=H100 device_count=8 model=meta-llama/Llama-3.1-405B-Instruct-FP8 task=lm-arena-chat
    # 在线空载功率（8 × 70 W + 主机 800 W）、主机功率、预填充吞吐与开机时间为示意值。
    description: 8×H100，Llama-3.1-405B-Instruct-FP8
    slots: 128
    power_w: [[0, 1360], [0.0624, 4060.4], [0.1246, 4184.3], [0.2493, 4544.3], [0.4989, 4962.1], [0.7477, 5274.6], [0.9973, 5406.1]]
    tpot_s: [[0.0624, 0.03406], [0.1246, 0.03565], [0.2493, 0.04039], [0.4989, 0.04689], [0.7477, 0.05561], [0.9973, 0.06527]]
    prefill_tokens_per_s: 5000
    boot_s: 180

sites:
  - {id: ciso, name: California (CISO), region: CISO, lat: 37.34, lon: -121.89, pue: 1.2, pools: [{id: h100, profile: h100x8, count: 3}]}
  - {id: erco, name: Texas (ERCO),      region: ERCO, lat: 32.90, lon: -97.04,  pue: 1.2, pools: [{id: h100, profile: h100x8, count: 3}]}
  - {id: pjm,  name: Virginia (PJM),    region: PJM,  lat: 39.04, lon: -77.49,  pue: 1.2, pools: [{id: h100, profile: h100x8, count: 4}]}

network:
  emulate_wan: true
  default_source: east

grid:
  price:  {dataset: "${CPC_DATA_DIR}/us-flat-price", signal: price}
  carbon: {dataset: "${CPC_DATA_DIR}/eia930-carbon-2024h1", signal: carbon_intensity}

workload:
  dataset: "${CPC_DATA_DIR}/azure-llm-2024-conv"
  start_s: 172800        # 2024-05-14 00:00 UTC（trace 起点为 2024-05-12 00:00 UTC），与电网数据的日期一致
  duration_s: 86400
  seed: 1

scheduler:
  routing:  {policy: nearest, params: {max_wait_s: 0.5}}
  capacity: {policy: reactive, params: {target_util: 0.6}}
  sim_control_interval_s: 300
  carbon_price_per_kg: 0.05    # USD/kgCO2（示意值）
