# Default scenario: 4 data-centre sites in eastern and western China, 3 source regions; servers
# calibrated with public measurements. A scenario describes the system under study independently of
# how it runs (simulation / live) and is deployed; service addresses of live runs are in endpoints files.
#
# Data preparation (download and conversion of raw data, see examples/datasets/README.md):
#   python examples/datasets/azure_llm.py --variant 2024-conv --zero-output fail     # workload
#   python examples/datasets/cn_grid/convert.py --start 2026-01-01 --end 2027-01-01   # price and carbon intensity
#   python examples/datasets/mlenergy.py                                               # server measurements (optional, HF_TOKEN)
# ${CPC_DATA_DIR} in dataset paths defaults to ~/.cache/cpc/datasets.

name: east-west-4dc

clock:
  start: "2026-07-15T00:00:00+08:00"   # start of signal time (summer working day with sharp peaks)
  speedup: 1                           # speed-up of the signal clock in live runs (1 = real time)

sources:                               # source regions; requests are assigned at random by share
  - {id: east,  name: Shanghai,  lat: 31.23, lon: 121.47, share: 0.40}
  - {id: south, name: Guangzhou, lat: 23.13, lon: 113.26, share: 0.35}
  - {id: north, name: Beijing,   lat: 39.90, lon: 116.40, share: 0.25}

node_profiles:            # server types: power and time per output token over occupancy (requests in service / slots)
  h100x8:
    # 8xH100 server running Llama-3.1-405B-Instruct-FP8; tables generated from ML.ENERGY Benchmark v3:
    #   cpc profile ${CPC_DATA_DIR}/mlenergy-benchmark-v3-llm --slots 128 --idle-w 1360 --host-w 800 \
    #       --where device=H100 device_count=8 model=meta-llama/Llama-3.1-405B-Instruct-FP8 task=lm-arena-chat
    # online idle power (8 x 70 W + host 800 W), host power, prefill throughput and boot time are illustrative.
    description: 8xH100, Llama-3.1-405B-Instruct-FP8
    slots: 128
    power_w: [[0, 1360], [0.0624, 4060.4], [0.1246, 4184.3], [0.2493, 4544.3], [0.4989, 4962.1], [0.7477, 5274.6], [0.9973, 5406.1]]
    tpot_s: [[0.0624, 0.03406], [0.1246, 0.03565], [0.2493, 0.04039], [0.4989, 0.04689], [0.7477, 0.05561], [0.9973, 0.06527]]
    prefill_tokens_per_s: 5000
    boot_s: 180
  b200x4:
    # 4xB200 server running the same model, generated likewise (device=B200 device_count=4, --idle-w 1160 --host-w 600).
    description: 4xB200, Llama-3.1-405B-Instruct-FP8
    slots: 128
    power_w: [[0, 1160], [0.0623, 4051.2], [0.1246, 3993.0], [0.2492, 4144.4], [0.4989, 4274.5], [0.9974, 4449.8]]
    tpot_s: [[0.0623, 0.02991], [0.1246, 0.03313], [0.2492, 0.03665], [0.4989, 0.04409], [0.9974, 0.05741]]
    prefill_tokens_per_s: 8000
    boot_s: 180

sites:
  - id: sh
    name: Yangtze River Delta - Shanghai
    region: shanghai                   # grid region: region key of the grid-signal datasets
    lat: 31.15
    lon: 121.12
    pue: 1.25
    pools: [{id: h100, profile: h100x8, count: 2}]
  - id: gd
    name: Greater Bay Area - Shaoguan
    region: guangdong
    lat: 24.81
    lon: 113.60
    pue: 1.25
    pools: [{id: h100, profile: h100x8, count: 2}]
  - id: gz
    name: Guizhou - Gui'an
    region: guizhou
    lat: 26.40
    lon: 106.40
    pue: 1.20
    pools: [{id: h100, profile: h100x8, count: 3}]
  - id: nm
    name: Inner Mongolia - Horinger
    region: inner_mongolia
    lat: 40.38
    lon: 111.82
    pue: 1.20
    pools:                             # heterogeneous pools: local policies prefer low full-load power per slot
      - {id: h100, profile: h100x8, count: 2}
      - {id: b200, profile: b200x4, count: 2}
    scheduler:
      dispatch: {policy: efficient_first}
      power: {policy: efficient}

network:
  base_ms: 4
  route_factor: 1.5
  km_per_ms: 200
  emulate_wan: true                    # the gateway injects the RTT in live runs
  default_source: east                 # source region of requests without an x-cpc-source header

grid:
  price:  {dataset: "${CPC_DATA_DIR}/cn-grid-2026", signal: price}
  carbon: {dataset: "${CPC_DATA_DIR}/cn-grid-2026", signal: carbon_intensity}
  dr_events:                           # example: peak shaving in Guangdong 15:00-17:00 (about one server at full load)
    - {site: gd, start: "2026-07-15T15:00:00+08:00", end: "2026-07-15T17:00:00+08:00", cap_kw: 8}

workload:
  dataset: "${CPC_DATA_DIR}/azure-llm-2024-conv"
  # window: 24 h from 2024-05-14 (Tuesday) 16:00 UTC; t = 0 of the trace is the clock start 2026-07-15 00:00
  # (UTC+8, i.e. 16:00 UTC), so UTC times of day correspond. About 54 requests/s on average.
  start_s: 230400
  duration_s: 86400
  seed: 1

slo:
  ttft_s: 2.0
  tpot_s: 0.15

scheduler:
  routing:  {policy: nearest, params: {max_wait_s: 0.5}}
  capacity: {policy: reactive, params: {target_util: 0.6}}
  control_interval_s: 15
  sim_control_interval_s: 300
  carbon_price_per_kg: 0.1             # CNY/kgCO2, the currency of the price signal
  queue_limit_per_slot: 4
