# Single-machine scenario: site lab has one real server (any OpenAI-compatible inference instance) whose
# power NVML measures; site emu has emulated servers.
#
# The inference instance of lab is vLLM or a similar server; without a model, an emulated site of the
# platform can stand in as the OpenAI-compatible interface:
#   cpc site -s configs/scenario.yaml --local --site gz --port 8000 --host 127.0.0.1
#   cpc up -s configs/scenario.local-gpu.yaml
# With vLLM, point upstreams[0].url at it and set the request model to its served-model-name (cpc live --model).
# Data: azure_llm.py --variant 2023-conv and cn_grid/convert.py (see examples/datasets/README.md).

name: local-gpu

clock:
  start: "2026-07-15T08:00:00+08:00"
  speedup: 60

sources:
  - {id: east, name: Shanghai, lat: 31.23, lon: 121.47, share: 1.0}

network:
  default_source: east

node_profiles:
  local:                       # local inference instance: measured power; the tables serve policy estimates and simulation (illustrative)
    description: single-GPU inference instance (illustrative)
    slots: 32
    power_w: [[0, 45], [0.25, 120], [1, 250]]
    tpot_s: [[0, 0.008], [1, 0.02]]
    prefill_tokens_per_s: 20000
    boot_s: 60
  emulated:
    # illustrative: tables from "60-400 W per GPU, power ~ occupancy^0.7, host 800-1500 W linear" at 5 occupancies
    description: 8-GPU A100-class server (illustrative)
    slots: 16
    power_w: [[0, 1280], [0.25, 2485.7], [0.5, 3304.4], [0.75, 4028.9], [1, 4700]]
    tpot_s: [[0, 0.025], [1, 0.04]]
    prefill_tokens_per_s: 20000
    boot_s: 60

sites:
  - id: lab
    name: local GPU (real server)
    region: guizhou
    lat: 26.40
    lon: 106.40
    pue: 1.2
    pools:
      - id: gpu
        profile: local
        backend: openai
        upstreams:
          - {id: lab-0, url: "http://127.0.0.1:8000", gpu_indices: [0], container: cpc-vllm-local, max_inflight: 32}
    measurement:
      sensors: [{type: nvml, gpus: [0]}]
      host: excluded           # server IT power covers the GPU only
  - id: emu
    name: emulated site
    region: guangdong
    lat: 24.81
    lon: 113.60
    pue: 1.25
    pools: [{id: main, profile: emulated, count: 2}]

grid:
  price:  {dataset: "${CPC_DATA_DIR}/cn-grid-2026", signal: price}
  carbon: {dataset: "${CPC_DATA_DIR}/cn-grid-2026", signal: carbon_intensity}

workload:                      # Azure LLM Inference Trace 2023 (conversation, 1 h, ~5.4 requests/s) thinned to ~2 requests/s
  dataset: "${CPC_DATA_DIR}/azure-llm-2023-conv"
  rate_scale: 0.4
  seed: 1
