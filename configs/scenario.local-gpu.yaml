# 本机"真实后端"联调场景：验证站点代理的 openai 后端 + NVML 实测功率链路。
#
# 站点 lab 使用 openai 后端，其上游是任意 OpenAI 兼容推理服务（vLLM、SGLang、llama.cpp server……）。
# 没有真实模型时，可以用平台自带的仿真站点充当"假 vLLM"：
#   cpc site -s configs/scenario.yaml --site gz --port 8000     # 在 8000 端口提供 OpenAI 兼容接口
#   cpc up -s configs/scenario.local-gpu.yaml                    # 启动 lab（NVML 读取本机 GPU 0）与 emu 两个站点
# 有真实 vLLM 时：把 upstreams[0].url 指向 vLLM，并把请求中的 model 设为 vLLM 的 served-model-name（loadgen --model）。

name: local-gpu

clock:
  start: "2026-07-15T08:00:00+08:00"
  speedup: 60

sources:
  - {id: east, name: 上海, lat: 31.23, lon: 121.47, share: 1.0}

sites:
  - id: lab
    name: 本机 GPU（真实后端）
    province: guizhou
    lat: 26.40
    lon: 106.40
    pue: 1.2
    backend: openai
    profile: local
    upstreams:
      - {id: lab-0, url: "http://127.0.0.1:8000", gpu_indices: [0], container: cpc-vllm-local, max_inflight: 32}
  - id: emu
    name: 仿真站点
    province: guangdong
    lat: 24.81
    lon: 113.60
    pue: 1.25
    nodes: 2
    profile: default

node_profiles:
  local:
    gpus: 1
    gpu_model: local
    host_idle_w: 60
    host_max_w: 120
  default: {}

workload:
  rps: 2
  input_tokens: {mean: 300, sigma: 0.5}
  output_tokens: {mean: 64, sigma: 0.5, max: 256}

scheduler:
  routing: {policy: least_loaded}
  capacity: {policy: static}
  control_interval_s: 10
