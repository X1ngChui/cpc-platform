[project]
name = "cpc-platform"
version = "0.4.0.dev0"
description = "算电协同（能耗感知）跨数据中心 AI 计算任务调度平台"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pyarrow>=15",
]

[project.optional-dependencies]
# 真实 GPU 功率采集与功率封顶（NVIDIA 官方 NVML Python 绑定）
nvml = ["nvidia-ml-py>=12.535"]
# 通过 Docker Engine API 启停推理容器（节点开关机）
docker = ["docker>=7.0"]
# 仿真结果作图
analysis = ["matplotlib>=3.8"]
# 文档编译（Typst 编译器的 Python 封装）
docs = ["typst>=0.14"]
dev = ["pytest>=8.0", "matplotlib>=3.8"]

[project.scripts]
cpc = "cpc.cli:main"

# 第三方策略与传感器以 entry points 注册，组名：cpc.routing、cpc.capacity、cpc.dispatch、cpc.power、cpc.sensors（见 cpc.registry）

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cpc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
