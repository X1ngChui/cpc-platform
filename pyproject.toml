[project]
name = "cpc-platform"
version = "0.4.0"
description = "Energy-aware scheduling of AI inference across data centres (compute-power coordination)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pyarrow>=15",
]

[project.optional-dependencies]
# GPU power readings and power capping (NVIDIA NVML bindings)
nvml = ["nvidia-ml-py>=12.535"]
# starting and stopping inference containers through the Docker Engine API
docker = ["docker>=7.0"]
# documentation build (Python bindings of the Typst compiler)
docs = ["typst>=0.14"]
dev = ["pytest>=8.0", "pyflakes>=3.2"]

[project.scripts]
cpc = "cpc.cli:main"

# Third-party policies and sensors register as entry points in the groups cpc.routing, cpc.capacity,
# cpc.dispatch, cpc.power and cpc.sensors (see cpc.registry).

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cpc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
