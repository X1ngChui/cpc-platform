# Quick-start scenario: 4 data-centre sites, 3 source regions, workload Azure LLM Inference Trace 2023
# (conversation service, about 1 hour).
#
# Data (about 1 MB download, see the guide, "Quick start"):
#   python examples/datasets/azure_llm.py --variant 2023-conv --zero-output fail
#   python examples/datasets/cn_grid/convert.py --start 2026-01-01 --end 2027-01-01
# then:
#   cpc check -s examples/quickstart/scenario.yaml
#   cpc sim -s examples/quickstart/scenario.yaml --hours 0.9
#   cpc run examples/quickstart/experiment.yaml

name: quickstart

clock:
  start: "2026-07-15T11:00:00+08:00"   # signal time starts on 15 July at 11:00 (sharp peak price in Guangdong 11-12 h)
  speedup: 1                           # speed-up of the signal clock in live runs; no effect in simulation

sources:                               # source regions; requests are assigned at random by share
  - {id: east,  name: Shanghai, lat: 31.23, lon: 121.47, share: 0.40}
  - {id: south, name: Guangzhou, lat: 23.13, lon: 113.26, share: 0.35}
  - {id: north, name: Beijing, lat: 39.90, lon: 116.40, share: 0.25}

node_profiles:                         # server types: power and time per output token over occupancy
  h100x8:
    description: 8xH100, Llama-3.1-405B-Instruct-FP8 (tables from ML.ENERGY Benchmark v3; idle and host power illustrative)
    slots: 128
    power_w: [[0, 1360], [0.0624, 4060.4], [0.1246, 4184.3], [0.2493, 4544.3], [0.4989, 4962.1], [0.7477, 5274.6], [0.9973, 5406.1]]
    tpot_s: [[0.0624, 0.03406], [0.1246, 0.03565], [0.2493, 0.04039], [0.4989, 0.04689], [0.7477, 0.05561], [0.9973, 0.06527]]
    prefill_tokens_per_s: 5000
    boot_s: 180
  b200x4:
    description: 4xB200, same model (generated likewise; idle and host power illustrative)
    slots: 128
    power_w: [[0, 1160], [0.0623, 4051.2], [0.1246, 3993.0], [0.2492, 4144.4], [0.4989, 4274.5], [0.9974, 4449.8]]
    tpot_s: [[0.0623, 0.02991], [0.1246, 0.03313], [0.2492, 0.03665], [0.4989, 0.04409], [0.9974, 0.05741]]
    prefill_tokens_per_s: 8000
    boot_s: 180

sites:                                 # data-centre sites
  - {id: sh, name: Yangtze River Delta - Shanghai, region: shanghai, lat: 31.15, lon: 121.12, pue: 1.25,
     pools: [{id: h100, profile: h100x8, count: 1}]}
  - {id: gd, name: Greater Bay Area - Shaoguan, region: guangdong, lat: 24.81, lon: 113.60, pue: 1.25,
     pools: [{id: h100, profile: h100x8, count: 1}]}
  - {id: gz, name: Guizhou - Gui'an, region: guizhou, lat: 26.40, lon: 106.40, pue: 1.20,
     pools: [{id: h100, profile: h100x8, count: 2}]}
  - id: nm
    name: Inner Mongolia - Horinger
    region: inner_mongolia
    lat: 40.38
    lon: 111.82
    pue: 1.20
    pools:                             # two server types; local policies prefer low power per slot
      - {id: h100, profile: h100x8, count: 1}
      - {id: b200, profile: b200x4, count: 1}
    scheduler:
      dispatch: {policy: efficient_first}
      power: {policy: efficient}

grid:
  price:  {dataset: "${CPC_DATA_DIR}/cn-grid-2026", signal: price}
  carbon: {dataset: "${CPC_DATA_DIR}/cn-grid-2026", signal: carbon_intensity}
  dr_events:                           # demand response: Guangdong facility power at most 5 kW 11:20-11:50
    - {site: gd, cap_kw: 5, start: "2026-07-15T11:20:00+08:00", end: "2026-07-15T11:50:00+08:00"}

workload:
  dataset: "${CPC_DATA_DIR}/azure-llm-2023-conv"
  seed: 1

slo:
  ttft_s: 2.0
  tpot_s: 0.15

scheduler:
  routing:  {policy: nearest, params: {max_wait_s: 0.5}}
  capacity: {policy: reactive, params: {target_util: 0.6}}
  control_interval_s: 15
  sim_control_interval_s: 60
  carbon_price_per_kg: 0.1
