# Quick start: compare 3 combinations of global policies on the quickstart scenario
# (cpc run examples/quickstart/experiment.yaml).

name: quickstart
scenario: scenario.yaml          # relative to this file
hours: 0.9                       # the workload lasts about 58 minutes
bin_s: 60                        # one time-series row per 60 s
variants:
  - name: nearest-static         # nearest site, all servers always on
    routing:  {policy: nearest}
    capacity: {policy: static}
  - name: nearest-reactive       # nearest site, servers switched with the load
    routing:  {policy: nearest}
    capacity: {policy: reactive}
  - name: cost-reactive          # site by price and carbon, servers switched with the load
    routing:  {policy: cost_aware}
    capacity: {policy: reactive}
