# Experiment: compare 4 combinations of global policies on the default scenario
# (cpc run examples/experiments/policies.yaml). Results go to results/policies/<variant>/ (result
# packages) and results/policies/comparison.csv.

name: policies
scenario: ../../configs/scenario.yaml
hours: 24
variants:
  - name: nearest-static                 # nearest site, all servers always on (baseline)
    routing:  {policy: nearest, params: {max_wait_s: 0.5}}
    capacity: {policy: static}
  - name: leastloaded-reactive           # load balancing + autoscaling
    routing:  {policy: least_loaded}
    capacity: {policy: reactive, params: {target_util: 0.6}}
  - name: cost-reactive                  # price- and carbon-aware routing + autoscaling
    routing:  {policy: cost_aware}
    capacity: {policy: reactive, params: {target_util: 0.6}}
  - name: weighted-gridaware             # two levels: capacity and routing weights by effective price, split by weight
    routing:  {policy: weighted}
    capacity: {policy: grid_aware}
