# 实验描述：美国 3 个平衡区的碳强度感知调度（cpc run examples/experiments/us-carbon.yaml）。
# 电价为统一示意值，等效电价的差异只来自碳强度 × 碳价。

name: us-carbon
scenario: ../../configs/scenario.us-eia.yaml
hours: 24
variants:
  - name: nearest-reactive
    routing:  {policy: nearest, params: {max_wait_s: 0.5}}
    capacity: {policy: reactive, params: {target_util: 0.6}}
  - name: cost-reactive
    routing:  {policy: cost_aware, params: {ttft_budget: 0.5}}
    capacity: {policy: reactive, params: {target_util: 0.6}}
  - name: weighted-gridaware
    routing:  {policy: weighted}
    capacity: {policy: grid_aware, params: {rtt_budget_ms: 80}}
