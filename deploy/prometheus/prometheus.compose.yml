# Prometheus 配置（Docker Compose 全仿真部署）。
# 真实云服务器部署见 prometheus.cloud.example.yml。
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: cpc-grid
    static_configs:
      - targets: ["grid:9000"]
  - job_name: cpc-site
    static_configs:
      - targets: ["site-sh:9100", "site-gd:9100", "site-gz:9100", "site-nm:9100"]
  - job_name: cpc-gateway
    static_configs:
      - targets: ["gateway:8080"]
  - job_name: cpc-controller
    static_configs:
      - targets: ["controller:9300"]
