# 能耗感知的"标准化指标"——Prometheus 记录规则（recording rules）。
#
# 设计：各类采集器（站点代理的服务器模型 / 传感器读数、通用功率导出器 cpc exporter）
# 输出的原始指标名各不相同；这里统一汇总为以 site 为维度的标准指标，调度器、仪表盘与实验分析只依赖这些标准指标。
# 命名遵循 Prometheus 官方约定 level:metric:operations。
groups:
  - name: cpc-energy
    interval: 5s
    rules:
      # ---- 设备层：GPU 功率（指标名与 NVIDIA dcgm-exporter 相同，仿真站点与真实站点通用）
      - record: site:gpu_power_watts:sum
        expr: sum by (site) (DCGM_FI_DEV_POWER_USAGE)
      # ---- 设备层（通用导出器 cpc exporter：NVIDIA GPU、CPU RAPL、本机 BMC 与 command 传感器）
      - record: host_kind:device_power_watts:sum
        expr: sum by (host, kind) (cpc_device_power_watts)
      - record: host:device_energy_joules:rate1m
        expr: sum by (host) (rate(cpc_device_energy_joules_total[1m]))
      # ---- 服务器层：IT 功率（GPU + 主机）
      - record: site:it_power_watts:sum
        expr: sum by (site) (cpc_site_it_power_watts)
      # ---- 设施层：设施功率 = IT 功率 × PUE
      - record: site:facility_power_watts:sum
        expr: sum by (site) (cpc_site_facility_power_watts)
      - record: global:facility_power_watts:sum
        expr: sum(site:facility_power_watts:sum)
      # ---- 电网层：用电成本速率（电价货币单位/小时）与碳排放速率（kg/小时）
      - record: site:energy_cost_per_hour
        expr: site:facility_power_watts:sum / 1000 * on (site) group_left max by (site) (cpc_grid_price_per_kwh)
      - record: site:carbon_kg_per_hour
        expr: site:facility_power_watts:sum / 1000 * on (site) group_left max by (site) (cpc_grid_carbon_intensity_kg_per_kwh)
      - record: global:energy_cost_per_hour
        expr: sum(site:energy_cost_per_hour)
      - record: global:carbon_kg_per_hour
        expr: sum(site:carbon_kg_per_hour)
      # ---- 需求响应：设施功率相对上限的余量（无上限的站点不出现）
      - record: site:power_cap_headroom_watts
        expr: max by (site) (cpc_grid_power_cap_kw > 0) * 1000 - on (site) site:facility_power_watts:sum
      # ---- 能效：每输出 token 的设施能耗（J/token）
      - record: site:joules_per_output_token:rate1m
        expr: >
          site:facility_power_watts:sum
          / on (site) (sum by (site) (rate(cpc_site_tokens_total{kind="completion"}[1m])) > 0)

  - name: cpc-service
    interval: 5s
    rules:
      - record: source_site:requests:rate1m
        expr: sum by (source, site) (rate(cpc_gateway_requests_total{status="200"}[1m]))
      - record: site:requests:rate1m
        expr: sum by (site) (rate(cpc_gateway_requests_total{status="200"}[1m]))
      - record: site:ttft_seconds:p99_1m
        expr: histogram_quantile(0.99, sum by (le, site) (rate(cpc_gateway_ttft_seconds_bucket[1m])))
      - record: global:slo_attainment:ratio5m
        expr: sum(rate(cpc_gateway_slo_total{result="met"}[5m])) / sum(rate(cpc_gateway_slo_total[5m]))
