apiVersion: v1
kind: ConfigMap
metadata:
  name: cpc-endpoints
  namespace: cpc
data:
  endpoints.yaml: "grid: http://grid.cpc.svc:9000\ngateway: http://gateway.cpc.svc:8080\n\
    controller: http://controller.cpc.svc:9300\nsites:\n  sh: http://site-sh.cpc.svc:9100\n\
    \  gd: http://site-gd.cpc.svc:9100\n  gz: http://site-gz.cpc.svc:9100\n  nm: http://site-nm.cpc.svc:9100\n"
