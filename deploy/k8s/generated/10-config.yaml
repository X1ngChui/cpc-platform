apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: cpc
data:
  prometheus.yml: "global:\n  scrape_interval: 5s\n  evaluation_interval: 5s\nrule_files:\n\
    - /etc/prometheus/rules/*.yml\nscrape_configs:\n- job_name: cpc-grid\n  static_configs:\n\
    \  - targets:\n    - grid.cpc.svc:9000\n- job_name: cpc-site\n  static_configs:\n\
    \  - targets:\n    - site-sh.cpc.svc:9100\n    - site-gd.cpc.svc:9100\n    - site-gz.cpc.svc:9100\n\
    \    - site-nm.cpc.svc:9100\n- job_name: cpc-gateway\n  static_configs:\n  - targets:\n\
    \    - gateway.cpc.svc:8080\n- job_name: cpc-controller\n  static_configs:\n \
    \ - targets:\n    - controller.cpc.svc:9300\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: cpc
data:
  cpc-energy.yml: "# 能耗感知的\"标准化指标\"——Prometheus 记录规则（recording rules）。\n#\n# 设计：各类采集器（站点代理的模型/NVML\
    \ 读数、NVIDIA dcgm-exporter、Kepler、IPMI exporter）\n# 输出的原始指标名各不相同；这里统一汇总为以 site\
    \ 为维度的标准指标，调度器、仪表盘与实验分析只依赖这些标准指标。\n# 命名遵循 Prometheus 官方约定 level:metric:operations。\n\
    groups:\n  - name: cpc-energy\n    interval: 5s\n    rules:\n      # ---- 设备层：GPU\
    \ 功率（与 dcgm-exporter 同名指标，仿真站点与真实站点通用）\n      - record: site:gpu_power_watts:sum\n\
    \        expr: sum by (site) (DCGM_FI_DEV_POWER_USAGE)\n      # ---- 设备层（通用导出器\
    \ cpc exporter，覆盖 NVIDIA/AMD/Intel/昇腾/CPU RAPL/整机 BMC 等）\n      - record: host_kind:device_power_watts:sum\n\
    \        expr: sum by (host, kind) (cpc_device_power_watts)\n      - record: host:device_energy_joules:rate1m\n\
    \        expr: sum by (host) (rate(cpc_device_energy_joules_total[1m]))\n    \
    \  # ---- 服务器层：IT 功率（GPU + 主机）\n      - record: site:it_power_watts:sum\n    \
    \    expr: sum by (site) (cpc_site_it_power_watts)\n      # ---- 设施层：设施功率 = IT\
    \ 功率 × PUE\n      - record: site:facility_power_watts:sum\n        expr: sum by\
    \ (site) (cpc_site_facility_power_watts)\n      - record: global:facility_power_watts:sum\n\
    \        expr: sum(site:facility_power_watts:sum)\n      # ---- 电网层：用电成本速率（元/小时）与碳排放速率（kg/小时）\n\
    \      - record: site:energy_cost_yuan_per_hour\n        expr: site:facility_power_watts:sum\
    \ / 1000 * on (site) group_left max by (site) (cpc_grid_price_yuan_per_kwh)\n\
    \      - record: site:carbon_kg_per_hour\n        expr: site:facility_power_watts:sum\
    \ / 1000 * on (site) group_left max by (site) (cpc_grid_carbon_kg_per_kwh)\n \
    \     - record: global:energy_cost_yuan_per_hour\n        expr: sum(site:energy_cost_yuan_per_hour)\n\
    \      - record: global:carbon_kg_per_hour\n        expr: sum(site:carbon_kg_per_hour)\n\
    \      # ---- 需求响应：设施功率相对上限的余量（无上限的站点不出现）\n      - record: site:power_cap_headroom_watts\n\
    \        expr: max by (site) (cpc_grid_power_cap_kw > 0) * 1000 - on (site) site:facility_power_watts:sum\n\
    \      # ---- 能效：每输出 token 的设施能耗（J/token）\n      - record: site:joules_per_output_token:rate1m\n\
    \        expr: >\n          site:facility_power_watts:sum\n          / on (site)\
    \ (sum by (site) (rate(cpc_site_tokens_total{kind=\"completion\"}[1m])) > 0)\n\
    \n  - name: cpc-service\n    interval: 5s\n    rules:\n      - record: source_site:requests:rate1m\n\
    \        expr: sum by (source, site) (rate(cpc_gateway_requests_total{status=\"\
    200\"}[1m]))\n      - record: site:requests:rate1m\n        expr: sum by (site)\
    \ (rate(cpc_gateway_requests_total{status=\"200\"}[1m]))\n      - record: site:ttft_seconds:p99_1m\n\
    \        expr: histogram_quantile(0.99, sum by (le, site) (rate(cpc_gateway_ttft_seconds_bucket[1m])))\n\
    \      - record: global:slo_attainment:ratio5m\n        expr: sum(rate(cpc_gateway_slo_total{result=\"\
    met\"}[5m])) / sum(rate(cpc_gateway_slo_total[5m]))\n"
---
