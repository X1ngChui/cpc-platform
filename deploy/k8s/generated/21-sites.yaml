apiVersion: apps/v1
kind: Deployment
metadata:
  name: site-sh
  namespace: cpc
  labels:
    app: site-sh
    app.kubernetes.io/part-of: cpc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: site-sh
  template:
    metadata:
      labels:
        app: site-sh
        app.kubernetes.io/part-of: cpc
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9100'
    spec:
      containers:
      - name: site-sh
        image: cpc-platform:latest
        imagePullPolicy: IfNotPresent
        args:
        - site
        - -s
        - /app/configs/scenario.yaml
        - --site
        - sh
        - --host
        - 0.0.0.0
        - --port
        - '9100'
        ports:
        - containerPort: 9100
          name: http
        env:
        - name: CPC_ENDPOINTS
          value: /etc/cpc/endpoints.yaml
        volumeMounts:
        - name: cpc-endpoints
          mountPath: /etc/cpc
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 9100
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9100
          periodSeconds: 10
          failureThreshold: 3
      volumes:
      - name: cpc-endpoints
        configMap:
          name: cpc-endpoints
      nodeSelector:
        topology.kubernetes.io/region: sh
---
apiVersion: v1
kind: Service
metadata:
  name: site-sh
  namespace: cpc
  labels:
    app: site-sh
spec:
  selector:
    app: site-sh
  ports:
  - name: http
    port: 9100
    targetPort: 9100
    nodePort: 30101
  type: NodePort
---
