apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: cpc
  labels:
    app: gateway
    app.kubernetes.io/part-of: cpc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        app.kubernetes.io/part-of: cpc
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8080'
    spec:
      containers:
      - name: gateway
        image: cpc-platform:latest
        imagePullPolicy: IfNotPresent
        args:
        - gateway
        - -s
        - /app/configs/scenario.yaml
        - --host
        - 0.0.0.0
        - --policy
        - nearest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: CPC_ENDPOINTS
          value: /etc/cpc/endpoints.yaml
        volumeMounts:
        - name: cpc-endpoints
          mountPath: /etc/cpc
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
          failureThreshold: 3
      volumes:
      - name: cpc-endpoints
        configMap:
          name: cpc-endpoints
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: cpc
  labels:
    app: gateway
spec:
  selector:
    app: gateway
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30080
  type: NodePort
