apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  namespace: cpc
  labels:
    app: controller
    app.kubernetes.io/part-of: cpc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: controller
  template:
    metadata:
      labels:
        app: controller
        app.kubernetes.io/part-of: cpc
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9300'
    spec:
      containers:
      - name: controller
        image: cpc-platform:latest
        imagePullPolicy: IfNotPresent
        args:
        - controller
        - -s
        - /app/configs/scenario.yaml
        - --host
        - 0.0.0.0
        - --policy
        - reactive
        ports:
        - containerPort: 9300
          name: http
        env:
        - name: CPC_ENDPOINTS
          value: /etc/cpc/endpoints.yaml
        volumeMounts:
        - name: cpc-endpoints
          mountPath: /etc/cpc
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 9300
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9300
          periodSeconds: 10
          failureThreshold: 3
      volumes:
      - name: cpc-endpoints
        configMap:
          name: cpc-endpoints
---
apiVersion: v1
kind: Service
metadata:
  name: controller
  namespace: cpc
  labels:
    app: controller
spec:
  selector:
    app: controller
  ports:
  - name: http
    port: 9300
    targetPort: 9300
    nodePort: 30930
  type: NodePort
