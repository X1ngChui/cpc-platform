# Example scenario of a cloud experiment: 3 rented GPU servers are the real servers of 3 sites, and one more
# site has emulated servers only.
#
# - real pools (backend: openai): each upstream is a vLLM instance; power comes from the sensors of
#   measurement (NVML);
# - emulated pools (backend: emulated): servers emulated with the server model, mixed with real ones;
# - rented servers are usually in one region, so the gateway injects the wide-area latency
#   (network.emulate_wan: true); set it to false when the servers really are in different regions.
#
# measurement.host: excluded counts GPU power only (cloud VMs rarely expose RAPL or a BMC); bare-metal
# servers with a local BMC may add {type: ipmi, max_w: <limit>} with host: server (the site stack maps /dev/ipmi0).
# Copy this file to control-stack/scenario.yaml; site agents fetch it from the control node at startup
# (CONTROL_URL in .env of the site stack). Datasets live in CPC_DATA_DIR of the control node (used by the
# grid-signal service and cpc live); see examples/datasets/README.md.

name: cloud-3real-1sim

clock:
  start: "2026-07-15T08:00:00+08:00"
  speedup: 12            # 2 real hours cover 24 signal hours; use 1 for final experiments

sources:
  - {id: east,  name: Shanghai, lat: 31.23, lon: 121.47, share: 0.40}
  - {id: south, name: Guangzhou, lat: 23.13, lon: 113.26, share: 0.35}
  - {id: north, name: Beijing, lat: 39.90, lon: 116.40, share: 0.25}

node_profiles:
  gpu-server:              # real server: measured power; the tables serve policy estimates and simulation (illustrative; use cpc measure)
    description: single-GPU inference server (illustrative)
    slots: 32
    power_w: [[0, 170], [0.25, 260], [1, 400]]
    tpot_s: [[0, 0.03], [1, 0.05]]
    prefill_tokens_per_s: 4000
    boot_s: 90
    cap_min_ratio: 0.6
  emulated-a10:            # emulated server of the same class (illustrative; generate from measurements of the real servers)
    description: single A10-class server (illustrative)
    slots: 32
    power_w: [[0, 170], [0.25, 230], [0.5, 280], [1, 400]]
    tpot_s: [[0, 0.03], [1, 0.048]]
    prefill_tokens_per_s: 4000
    boot_s: 90

sites:
  - id: sh
    name: Yangtze River Delta - Shanghai (real server A)
    region: shanghai
    lat: 31.15
    lon: 121.12
    pue: 1.25
    pools:
      - id: gpu
        profile: gpu-server
        backend: openai
        upstreams: [{id: sh-vllm0, url: "http://vllm-0:8000", gpu_indices: [0], container: cpc-vllm-0, max_inflight: 32}]
    measurement: {sensors: [{type: nvml}], host: excluded}
  - id: gz
    name: Guizhou - Gui'an (real server B)
    region: guizhou
    lat: 26.40
    lon: 106.40
    pue: 1.20
    pools:
      - id: gpu
        profile: gpu-server
        backend: openai
        upstreams: [{id: gz-vllm0, url: "http://vllm-0:8000", gpu_indices: [0], container: cpc-vllm-0, max_inflight: 32}]
    measurement: {sensors: [{type: nvml}], host: excluded}
  - id: nm
    name: Inner Mongolia - Horinger (real server C)
    region: inner_mongolia
    lat: 40.38
    lon: 111.82
    pue: 1.20
    pools:
      - id: gpu
        profile: gpu-server
        backend: openai
        upstreams: [{id: nm-vllm0, url: "http://vllm-0:8000", gpu_indices: [0], container: cpc-vllm-0, max_inflight: 32}]
    measurement: {sensors: [{type: nvml}], host: excluded}
  - id: gd
    name: Greater Bay Area - Shaoguan (emulated)
    region: guangdong
    lat: 24.81
    lon: 113.60
    pue: 1.25
    pools: [{id: main, profile: emulated-a10, count: 2}]

network:
  emulate_wan: true
  default_source: east

grid:
  price:  {dataset: "${CPC_DATA_DIR}/cn-grid-2026", signal: price}
  carbon: {dataset: "${CPC_DATA_DIR}/cn-grid-2026", signal: carbon_intensity}

workload:                      # one day of Azure LLM Inference Trace 2024 (conversation), thinned to ~2.7 requests/s
  dataset: "${CPC_DATA_DIR}/azure-llm-2024-conv"
  start_s: 230400
  duration_s: 86400
  rate_scale: 0.05
  seed: 1

slo:
  ttft_s: 2.0
  tpot_s: 0.15

scheduler:
  routing:  {policy: nearest}
  capacity: {policy: reactive, params: {target_util: 0.6}}
  control_interval_s: 30
