# Control stack on one control server (a small instance without GPUs, or shared with a site).
#
# Services: grid-signal service, routing gateway, capacity controller, Prometheus, Grafana, and the
# emulated sites of the scenario (optional).
# Security: open the grid/gateway/controller/site ports only to servers of the same VPC (security group) and
#           set CPC_ADMIN_TOKEN; Prometheus and Grafana bind to 127.0.0.1 and are reached through SSH tunnels.
# Preparation:
#   printf 'CPC_ADMIN_TOKEN=...\nGRAFANA_PASSWORD=...\nCPC_IMAGE=ghcr.io/x1ngchui/cpc-platform:0.4.1\n' > .env
#   cp ../scenario.cloud.example.yaml scenario.yaml        # adapt to the experiment
#   cp ../endpoints.cloud.example.yaml endpoints.yaml      # fill in the server addresses
#   cp ../prometheus.cloud.example.yml prometheus.yml      # fill in the server addresses
#   docker compose up -d

name: cpc-control

x-cpc: &cpc
  image: ${CPC_IMAGE:-cpc-platform:latest}
  restart: unless-stopped
  volumes:
    - ./scenario.yaml:/app/cfg/scenario.yaml:ro
    - ./endpoints.yaml:/app/cfg/endpoints.yaml:ro
    - ./logs:/logs
    - ${CPC_DATA_DIR:-~/.cache/cpc/datasets}:/var/lib/cpc/datasets:ro   # datasets (prepared on the control node with examples/datasets)
  environment:
    CPC_ENDPOINTS: /app/cfg/endpoints.yaml
    CPC_ADMIN_TOKEN: ${CPC_ADMIN_TOKEN:?set the admin token CPC_ADMIN_TOKEN in .env}

services:
  grid:
    <<: *cpc
    command: ["grid", "-s", "/app/cfg/scenario.yaml", "--host", "0.0.0.0", "--port", "9000"]
    ports: ["9000:9000"]

  gateway:
    <<: *cpc
    command: ["gateway", "-s", "/app/cfg/scenario.yaml", "--host", "0.0.0.0", "--port", "8080", "--log", "/logs/gateway.jsonl"]
    ports: ["8080:8080"]

  controller:
    <<: *cpc
    command: ["controller", "-s", "/app/cfg/scenario.yaml", "--host", "0.0.0.0", "--port", "9300", "--log", "/logs/controller.jsonl"]
    ports: ["9300:9300"]

  # emulated site of the scenario (gd in the example); remove without emulated sites
  site-gd:
    <<: *cpc
    command: ["site", "-s", "/app/cfg/scenario.yaml", "--site", "gd", "--host", "0.0.0.0", "--port", "9104"]
    ports: ["9104:9104"]

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../prometheus/rules:/etc/prometheus/rules:ro
      - prom-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]   # local only; remotely: ssh -L 9090:localhost:9090 <control node>

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set the Grafana admin password GRAFANA_PASSWORD in .env}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cpc-overview.json
    volumes:
      - ../../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]   # local only; remotely: ssh -L 3000:localhost:3000 <control node>

volumes:
  prom-data:
