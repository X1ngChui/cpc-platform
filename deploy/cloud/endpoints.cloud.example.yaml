# Service addresses of a cloud deployment (on the control node only; site agents fetch them from there).
# Replace <...> with the private addresses (same VPC) or public addresses of the servers. The control stack
# (grid/gateway/controller/Prometheus/Grafana) runs on one server (a small instance without GPUs, or shared
# with a site); emulated sites (such as gd) start with the control stack.
grid: http://<control-node-ip>:9000
gateway: http://<control-node-ip>:8080
controller: http://<control-node-ip>:9300
sites:
  sh: http://<server-a-ip>:9100
  gz: http://<server-b-ip>:9100
  nm: http://<server-c-ip>:9100
  gd: http://<control-node-ip>:9104
