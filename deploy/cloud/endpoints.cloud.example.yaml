# 云服务器部署的服务地址：把 <...> 换成各服务器的内网 IP（同一 VPC 内）或公网 IP。
# 控制栈（grid/gateway/controller/Prometheus/Grafana）部署在一台服务器上（可以是无 GPU 的小规格实例，
# 也可以与某个站点共用一台机器）。仿真站点（如 gd）随控制栈一起启动。
grid: http://<控制节点IP>:9000
gateway: http://<控制节点IP>:8080
controller: http://<控制节点IP>:9300
sites:
  sh: http://<服务器A_IP>:9100
  gz: http://<服务器B_IP>:9100
  nm: http://<服务器C_IP>:9100
  gd: http://<控制节点IP>:9104
