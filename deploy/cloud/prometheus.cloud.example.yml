# Prometheus configuration of a cloud deployment. Replace <...> with the server addresses; services of the
# control stack are reached by container name.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: cpc-grid
    static_configs: [{targets: ["grid:9000"]}]
  - job_name: cpc-gateway
    static_configs: [{targets: ["gateway:8080"]}]
  - job_name: cpc-controller
    static_configs: [{targets: ["controller:9300"]}]
  - job_name: cpc-site
    static_configs:
      - targets: ["<server-a-ip>:9100", "<server-b-ip>:9100", "<server-c-ip>:9100", "site-gd:9104"]
  # optional: node_exporter (site stack --profile host) for host CPU/memory/network; RAPL energy on bare metal
  - job_name: node
    static_configs:
      - {targets: ["<server-a-ip>:9101"], labels: {site: sh}}   # node_exporter of the site stack listens on 9101 (the site agent uses 9100)
