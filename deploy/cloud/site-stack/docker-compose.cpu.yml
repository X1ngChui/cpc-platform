# Site stack (CPU): a server without GPUs runs llama.cpp on its CPUs as the real server of a site.
#
# Services:
#   llm-0       inference instance (llama.cpp server, OpenAI-compatible), one real server for the platform
#   site-agent  site agent: fetches scenario and addresses from the control node at startup; power from RAPL
#               (CPU and memory) and the local BMC (whole server)
#
# Prerequisites: Docker; bare-metal Linux (RAPL and /dev/ipmi0); a GGUF model file in MODEL_DIR, e.g.:
#   mkdir -p /data/models && curl -L -o /data/models/qwen2.5-0.5b-instruct-q4_k_m.gguf \
#     https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
# Usage:
#   cp .env.example .env   # set SITE_ID, CONTROL_URL, CPC_ADMIN_TOKEN, CPC_IMAGE and add MODEL_DIR, MODEL_FILE
#   docker compose -f docker-compose.cpu.yml up -d
#
# The site in the scenario (the upstream url is the service name of this file, no accelerators; whole-server power):
#   pools: [{id: cpu, profile: <server type>, backend: openai,
#            upstreams: [{id: <site>-llm0, url: "http://llm-0:8080", container: cpc-llm-0, max_inflight: 4}]}]
#   measurement: {sensors: [{type: ipmi, max_w: 2000}, {type: rapl, root: /host/powercap}], host: server}
# llama.cpp splits the context -c evenly over --parallel slots: each slot must hold the longest request.

name: cpc-site

services:
  llm-0:
    image: ghcr.io/ggml-org/llama.cpp:${LLAMA_TAG:-server}
    container_name: cpc-llm-0
    restart: "no"                    # switched by the site agent
    volumes: ["${MODEL_DIR:-/data/models}:/models:ro"]
    command: ["-m", "/models/${MODEL_FILE:-qwen2.5-0.5b-instruct-q4_k_m.gguf}", "--alias", "cpc", "--host", "0.0.0.0",
              "--port", "8080", "-c", "${CONTEXT:-65536}", "--parallel", "${PARALLEL:-4}", "-t", "${THREADS:-16}"]

  site-agent:
    image: ${CPC_IMAGE:-cpc-platform:latest}
    restart: unless-stopped
    command: ["site", "--control", "${CONTROL_URL:?set CONTROL_URL in .env to the grid-signal service of the control node}",
              "--site", "${SITE_ID}", "--host", "0.0.0.0", "--port", "9100"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock          # starts and stops the inference container
      - /sys/devices/virtual/powercap:/host/powercap:ro    # RAPL (Docker masks the powercap directory in containers)
    devices: ["/dev/ipmi0:/dev/ipmi0"]                     # local BMC
    environment:
      CPC_ADMIN_TOKEN: ${CPC_ADMIN_TOKEN:?set CPC_ADMIN_TOKEN in .env, identical to the control stack}
    ports: ["9100:9100"]
