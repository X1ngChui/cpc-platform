# 站点栈（CPU）：没有 GPU 的服务器以 llama.cpp 在 CPU 上推理，作为一个站点的真实服务器。
#
# 组成：
#   llm-0       推理实例（llama.cpp server，OpenAI 兼容接口），对平台而言是一台真实服务器
#   site-agent  站点代理：启动时从控制节点取得场景与服务地址；功率由 RAPL（CPU 与内存）与本机 BMC（整机）测量
#
# 前置：Docker；裸金属 Linux（RAPL 与 /dev/ipmi0）；模型文件（GGUF）放在 MODEL_DIR 中，例如：
#   mkdir -p /data/models && curl -L -o /data/models/qwen2.5-0.5b-instruct-q4_k_m.gguf \
#     https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
# 用法：
#   cp .env.example .env   # 修改 SITE_ID、CONTROL_URL、CPC_ADMIN_TOKEN、CPC_IMAGE，并加入 MODEL_DIR、MODEL_FILE
#   docker compose -f docker-compose.cpu.yml up -d
#
# 场景中该站点的写法（上游的 url 为本文件中的服务名，不声明加速卡；功率为整机读数）：
#   pools: [{id: cpu, profile: <服务器类型>, backend: openai,
#            upstreams: [{id: <站点>-llm0, url: "http://llm-0:8080", container: cpc-llm-0, max_inflight: 4}]}]
#   measurement: {sensors: [{type: ipmi, max_w: 2000}, {type: rapl, root: /host/powercap}], host: server}
# llama.cpp 把上下文长度 -c 平均分给 --parallel 个并发槽：每槽的上下文须容纳负载中最长的请求。

name: cpc-site

services:
  llm-0:
    image: ghcr.io/ggml-org/llama.cpp:${LLAMA_TAG:-server}
    container_name: cpc-llm-0
    restart: "no"                    # 由站点代理开关
    volumes: ["${MODEL_DIR:-/data/models}:/models:ro"]
    command: ["-m", "/models/${MODEL_FILE:-qwen2.5-0.5b-instruct-q4_k_m.gguf}", "--alias", "cpc", "--host", "0.0.0.0",
              "--port", "8080", "-c", "${CONTEXT:-65536}", "--parallel", "${PARALLEL:-4}", "-t", "${THREADS:-16}"]

  site-agent:
    image: ${CPC_IMAGE:-cpc-platform:latest}
    restart: unless-stopped
    command: ["site", "--control", "${CONTROL_URL:?请在 .env 中设置控制节点的电网信号服务地址 CONTROL_URL}",
              "--site", "${SITE_ID}", "--host", "0.0.0.0", "--port", "9100"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock          # 开关推理容器
      - /sys/devices/virtual/powercap:/host/powercap:ro    # RAPL（Docker 默认屏蔽容器内的 powercap 目录）
    devices: ["/dev/ipmi0:/dev/ipmi0"]                     # 本机 BMC
    environment:
      CPC_ADMIN_TOKEN: ${CPC_ADMIN_TOKEN:?请在 .env 中设置与控制栈相同的 CPC_ADMIN_TOKEN}
    ports: ["9100:9100"]
