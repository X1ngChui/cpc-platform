# Hardware power capping (override of the GPU site stack): the site agent sets GPU power limits through
# NVML, which needs SYS_ADMIN in the container.
# Usage: docker compose -f docker-compose.yml -f docker-compose.powercap.yml up -d
services:
  site-agent:
    command: ["site", "--control", "${CONTROL_URL:?set CONTROL_URL in .env to the grid-signal service of the control node}",
              "--site", "${SITE_ID}", "--host", "0.0.0.0", "--port", "9100", "--enable-power-cap"]
    cap_add: [SYS_ADMIN]
