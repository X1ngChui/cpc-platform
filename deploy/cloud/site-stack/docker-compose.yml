# Site stack (GPU) on every GPU server (the inference instances of one server = the real pool of a site).
# Servers without GPUs use docker-compose.cpu.yml (llama.cpp).
#
# Services:
#   vllm-0 / vllm-1   inference instances (OpenAI-compatible), one GPU each, one real server each for the platform
#   site-agent        site agent: fetches scenario and addresses from the control node at startup; queueing and
#                     dispatch, power measurement as declared by measurement, instance on/off (Docker API),
#                     optional power capping (docker-compose.powercap.yml)
#   node-exporter     (optional) host CPU/memory/network metrics; RAPL energy on bare metal
#
# Prerequisites: NVIDIA driver + Docker + NVIDIA Container Toolkit (see the guide, "Live experiments").
# Usage:
#   cp .env.example .env   # set SITE_ID, CONTROL_URL, CPC_ADMIN_TOKEN, MODEL, ...
#   docker compose up -d

name: cpc-site

x-vllm: &vllm
  image: vllm/vllm-openai:${VLLM_TAG:-latest}
  restart: unless-stopped
  ipc: host
  volumes:
    - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
  environment:
    HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
    VLLM_USE_MODELSCOPE: ${VLLM_USE_MODELSCOPE:-False}

services:
  vllm-0:
    <<: *vllm
    container_name: cpc-vllm-0
    # VLLM_ARGS: extra vLLM arguments (see .env.example)
    command: >-
      --model ${MODEL} --served-model-name cpc --max-model-len ${MAX_MODEL_LEN:-8192}
      --gpu-memory-utilization 0.90 --max-num-seqs ${MAX_NUM_SEQS:-32} ${VLLM_ARGS:-}
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ["0"], capabilities: [gpu]}]
    ports: ["8000:8000"]

  # second GPU (remove this service on single-GPU servers, and the upstream in the scenario)
  vllm-1:
    <<: *vllm
    container_name: cpc-vllm-1
    profiles: ["gpu2"]
    command: >-
      --model ${MODEL} --served-model-name cpc --max-model-len ${MAX_MODEL_LEN:-8192}
      --gpu-memory-utilization 0.90 --max-num-seqs ${MAX_NUM_SEQS:-32} ${VLLM_ARGS:-}
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ["1"], capabilities: [gpu]}]
    ports: ["8001:8000"]

  site-agent:
    image: ${CPC_IMAGE:-cpc-platform:latest}
    restart: unless-stopped
    command: ["site", "--control", "${CONTROL_URL:?set CONTROL_URL in .env to the grid-signal service of the control node}",
              "--site", "${SITE_ID}", "--host", "0.0.0.0", "--port", "9100"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # starts and stops the vLLM containers (server on/off)
      # uncomment for the rapl sensor on bare metal and write {type: rapl, root: /host/powercap} in the scenario
      # (Docker masks /sys/devices/virtual/powercap in containers):
      # - /sys/devices/virtual/powercap:/host/powercap:ro
    # uncomment for the ipmi sensor (local BMC) on bare metal:
    # devices: ["/dev/ipmi0:/dev/ipmi0"]
    environment:
      CPC_ADMIN_TOKEN: ${CPC_ADMIN_TOKEN:?set CPC_ADMIN_TOKEN in .env, identical to the control stack}
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]   # NVML power readings only
    ports: ["9100:9100"]

  node-exporter:
    image: prom/node-exporter:v1.9.1
    profiles: ["host"]
    restart: unless-stopped
    pid: host
    network_mode: host
    command: ["--path.rootfs=/host", "--web.listen-address=:9101"]   # the site agent uses 9100
    volumes: ["/:/host:ro,rslave"]
