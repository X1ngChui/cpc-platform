name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]   # 服务端只面向 Linux x86_64 与 aarch64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - name: smoke test (all services in one process)
        run: python scripts/smoke_test.py --offline --duration 20   # 测试场景：合成负载与随测试提交的电网数据

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install "typst>=0.12"
      - run: python docs/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: docs-pdf
          path: docs/pdf/*.pdf
