name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]   # services target Linux x86_64 and aarch64 only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - name: smoke test (services as separate processes, offline scenario)
        run: python scripts/smoke_test.py --offline --duration 20   # test scenario: synthetic workload and committed grid data

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install "typst>=0.14"   # PDF figures need Typst 0.14 or later
      - run: python docs/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: docs-pdf
          path: docs/pdf/*.pdf
